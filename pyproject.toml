[project]
name = "adaptivecarearena"
version = "0.1.0"
description = "Budgeted passive-sensing acquisition and escalation policy research on public behavioral-health sensing datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
]

[project.scripts]
adaptivecare-evaluate = "adaptivecarearena.__main__:main"
adaptivecare-data-audit = "adaptivecarearena.data_audit:main"

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "scipy>=1.11"]
dev = ["pytest>=8.0", "scipy>=1.11", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptivecarearena*", "caredata*", "emaselect*", "task*", "models*", "splits*", "eval*", "p0_audit*", "runtime*", "scripts*", "stage1*", "stage2_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not real_data\""
markers = [
    "real_data: requires the real downloaded CrossCheck and CES files",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
